name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # 每日评估回归集（评估报告 W4：回归集每日跑）
    - cron: "30 1 * * *"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        run: pip install -e ".[test]"
      - name: Run offline test suite
        run: pytest tests/ -q

  eval-regression:
    name: Eval regression (dev suite, frozen)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package with test extras
        run: pip install -e ".[test]"
      - name: Run frozen eval regression (dev suite)
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        # 冻结数据 + 实时图；无 API Key 时跳过（严重失败阻断需在仓库开启）
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "LLM_API_KEY 未配置，跳过评估回归"
            exit 0
          fi
          python -m finabot eval-run --suite dev --trials 1
