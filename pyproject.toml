[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finabot"
version = "0.1.4.post5"
requires-python = ">=3.10,<3.13"
dependencies = [
    "typer>=0.9.0,<1.0",
    "python-dotenv>=1.0.0,<2.0",
    "langchain-core>=0.3.0,<2.0",
    "langgraph>=0.2.0,<2.0",
    "litellm>=1.82.6,<1.83.0",
    "akshare>=1.14.0",
    "pandas>=2.0.0,<3.0",
    "requests>=2.31.0,<3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0,<10.0",
    "anyio>=4.0.0,<5.0",
]

# 核心：把 finabot 注册成系统命令
[project.scripts]
finabot = "finabot.cli.commands:app"

[tool.setuptools.packages.find]
include = ["finabot*"]
exclude = ["skills*", "tests*"]